<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
:root{--bg:#FFFBF7;--fg:#3D2B22;--accent:#D97757;--line:#E9C8B8;--hint:#A88B7D}
html,body{margin:0;background:transparent;overflow:hidden;font:15px/1.5 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  -webkit-tap-highlight-color:transparent}
#root{padding:0 4px 10px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px}
#root.below{padding:10px 4px 0;flex-direction:column-reverse}

/* ===== 消息条（聊天流） ===== */
.msg{position:relative;align-self:flex-start;max-width:100%;box-sizing:border-box;
  background:var(--bg);color:var(--fg);border:2px solid var(--fg);border-radius:14px;
  padding:7px 11px;box-shadow:3px 3px 0 rgba(61,43,34,.18);
  white-space:pre-wrap;word-break:break-word;
  animation:in .28s cubic-bezier(.34,1.56,.64,1) both;transform-origin:20% 100%}
#root.below .msg{transform-origin:20% 0%}
@keyframes in{from{transform:translateY(8px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.msg.out{animation:out .22s ease-in forwards}
@keyframes out{to{transform:translateY(-6px) scale(.92);opacity:0}}
.msg.old{opacity:.55;transition:opacity .3s}
/* 只有最新一条带尾巴 */
.tail{position:absolute;width:12px;height:12px;background:var(--bg);border:2px solid var(--fg);
  border-top:none;border-left:none;transform:rotate(45deg);bottom:-8px;left:30px}
#root.below .tail{top:-8px;bottom:auto;transform:rotate(-135deg)}
.more{font-size:11px;color:var(--hint);margin-top:2px}
/* ===== 长按小卡（像素风） ===== */
.msg.card{border-radius:0;border-width:3px;box-shadow:4px 4px 0 var(--line);padding:8px 10px;
  font-family:"Courier New",ui-monospace,monospace;letter-spacing:.5px;min-width:200px}
.msg.card .tail{border-radius:0}
.px-h{font-weight:bold;color:var(--accent);font-size:15px}
.px-bar{display:flex;gap:2px;margin:5px 0 4px}
.px-bar b{flex:1;height:10px;background:#F2E2D9;border:2px solid var(--fg)}
.px-bar b.on{background:var(--accent)}
.px-s{font-size:12px;line-height:1.5}
.px-n{color:var(--hint);margin-top:2px}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--accent);
  animation:dot 1s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}

/* ===== 输入 ===== */
#input{display:none;position:relative;box-sizing:border-box;width:100%;min-width:0;background:var(--bg);color:var(--fg);border:2px solid var(--fg);border-radius:14px;
  padding:9px 12px;box-shadow:3px 3px 0 rgba(61,43,34,.18);animation:in .22s cubic-bezier(.34,1.56,.64,1)}
.mode-input #input{display:block}
.mode-input .msg{display:none}
#title{font-size:11px;color:var(--hint);margin-bottom:5px}
.row{display:flex;gap:6px;align-items:flex-end}
textarea{flex:1;min-width:0;width:0;resize:none;border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;font:inherit;
  color:var(--fg);background:#fff;outline:none;max-height:96px;min-height:22px;line-height:1.4}
textarea:focus{border-color:var(--accent)}
button{border:none;border-radius:10px;background:var(--accent);color:#fff;font:600 14px/1 inherit;
  padding:9px 12px;min-width:44px}
button:active{transform:scale(.94)}
</style></head>
<body>
<div id="root">
  <div id="input">
    <div id="title">跟 Clawd 说点什么</div>
    <div class="row"><textarea id="ta" rows="1" placeholder="…"></textarea><button id="send">发送</button></div>
    <div class="tail"></div>
  </div>
</div>
<script>
var B = window.ClawdBridge || { submit:function(){}, close:function(){}, resize:function(){}, tap:function(){} };
var root = document.getElementById('root'), inputBox = document.getElementById('input'),
    ta = document.getElementById('ta'), send = document.getElementById('send');
var density = 3, tailX = 40, below = false, MAX_VISIBLE = 3, MAX_H = 0;

function reportSize() { B.resize(Math.ceil(root.getBoundingClientRect().height)); }
function msgs() { return Array.prototype.slice.call(root.querySelectorAll('.msg:not(.out)')); }
function placeTail(el) {
  var t = el.querySelector('.tail');
  if (t) t.style.left = Math.max(10, Math.min(el.offsetWidth - 26, tailX / density - 4 - el.offsetLeft)) + 'px';
}
// 消息往 Clawd 那一侧靠：尾巴在窗口右侧就右对齐，左侧就左对齐，中间就居中
function applyAlign() {
  var r = (tailX / density) / Math.max(1, window.innerWidth);
  var a = r > 0.62 ? 'flex-end' : (r < 0.38 ? 'flex-start' : 'center');
  root.style.alignItems = a;
  msgs().forEach(function (m) { m.style.alignSelf = a; });
  inputBox.style.alignSelf = 'stretch';   // 输入框始终占满宽度，否则会被挤出窗口左边
}
function refreshTails() {
  applyAlign();
  var list = msgs();
  list.forEach(function (m, i) {
    var t = m.querySelector('.tail');
    var latest = i === list.length - 1;
    if (latest && !t) { t = document.createElement('div'); t.className = 'tail'; m.appendChild(t); }
    if (!latest && t) t.remove();
    m.classList.toggle('old', !latest);
    if (latest) placeTail(m);
  });
  placeTail(inputBox);
}
function removeMsg(el) {
  el.classList.add('out');
  setTimeout(function () { el.remove(); refreshTails(); reportSize(); }, 220);
}
function clearAll() { msgs().forEach(function (m) { m.remove(); }); }

// 追加一条（新消息出现在离 Clawd 最近的一侧，旧的被往外推、变淡；超过上限最旧的飘走）
function push(html, opts) {
  opts = opts || {};
  var el = document.createElement('div');
  el.className = 'msg';
  if (opts.html) el.innerHTML = html; else el.textContent = html;
  if (opts.more) { var m = document.createElement('div'); m.className = 'more'; m.textContent = opts.more; el.appendChild(m); }
  if (opts.id) el.dataset.id = opts.id;
  root.insertBefore(el, inputBox);
  var list = msgs();
  while (list.length > MAX_VISIBLE) { removeMsg(list.shift()); }
  // 总高度超过窗口上限：旧的先飘走，保证最新一条完整可见（立即移除，不等动画，否则这一帧还会超高被裁）
  if (MAX_H > 0) {
    list = msgs();
    while (list.length > 1 && root.getBoundingClientRect().height > MAX_H) { list.shift().remove(); }
  }
  refreshTails();
  setTimeout(reportSize, 0);
  return el;
}

// ===== 原生 → 页面 =====
window.bubble = function (evt, data) {
  data = data || {};
  switch (evt) {
    case 'layout':
      density = data.density || density;
      tailX = data.tailX || tailX;
      below = !!data.below;
      root.classList.toggle('below', below);
      refreshTails();
      break;
    case 'reset':                   // 新一轮：清空旧消息
      setInput(false); clearAll(); reportSize();
      break;
    case 'push':                    // {text, more, max}
      setInput(false);
      if (data.max) MAX_VISIBLE = data.max;
      if (data.maxH) MAX_H = data.maxH;
      // 去掉「思考中」
      msgs().forEach(function (m) { if (m.dataset.id === 'typing') m.remove(); });
      push(data.text || '', { more: data.more });
      break;
    case 'card':                    // 长按小卡：{html}
      setInput(false); clearAll();
      push(data.html || '', { html: true }).classList.add('card');
      refreshTails();
      break;
    case 'say':                     // 兼容：单条
      setInput(false); clearAll(); push(data.text || '');
      break;
    case 'typing':
      setInput(false); clearAll();
      push('<span class="dots"><span></span><span></span><span></span></span>', { html: true, id: 'typing' });
      break;
    case 'input':
      setInput(true);
      document.getElementById('title').textContent = data.title || '跟 Clawd 说点什么';
      ta.placeholder = data.placeholder || '…';
      if (data.draft !== undefined) ta.value = data.draft;
      autoGrow(); refreshTails(); setTimeout(reportSize, 0);
      break;
    case 'focus':
      ta.focus();
      try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
      break;
    case 'blur': ta.blur(); break;
    case 'theme':
      var s = document.documentElement.style;
      if (data.bg) s.setProperty('--bg', data.bg);
      if (data.fg) s.setProperty('--fg', data.fg);
      if (data.accent) s.setProperty('--accent', data.accent);
      break;
  }
};

function setInput(on) { document.body.className = on ? 'mode-input' : ''; }
function autoGrow() {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 96) + 'px';
  reportSize();
}
ta.addEventListener('input', autoGrow);
ta.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); doSend(); }
});
send.addEventListener('click', doSend);
function doSend() {
  var t = ta.value.replace(/^\s+|\s+$/g, '');
  if (!t) { B.close(); return; }
  B.submit(t); ta.value = ''; autoGrow();
}
root.addEventListener('click', function (e) { if (!document.body.className && e.target.closest('.msg')) B.tap(); });
new ResizeObserver(reportSize).observe(root);
</script>
</body></html>
